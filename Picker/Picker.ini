; ---------- window ----------
[Back]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,432,290,12 | Fill Color 28,29,36,240 | StrokeWidth 1 | Stroke Color 70,74,90,255

[Title]
Meter=String
MeterStyle=StyleText
X=#Pad#
Y=12
FontSize=12
FontWeight=700
Text=Background Picker

[Close]
Meter=String
MeterStyle=StyleBtn
X=416
Y=10
StringAlign=Right
Padding=10,3,10,3
Text=X
LeftMouseUpAction=[!DeactivateConfig "#CURRENTCONFIG#"]

[BtnFolder]
Meter=String
MeterStyle=StyleBtn
X=#Pad#
Y=46
Text=Open folder (add images)
LeftMouseUpAction=["#@#Backgrounds"]

[BtnReload]
Meter=String
MeterStyle=StyleBtn
X=8R
Y=r
Text=Reload
LeftMouseUpAction=[!Refresh]

[Slot1]
Meter=Shape
X=16
Y=92
Shape=Rectangle 0,0,128,72,6 | Fill Color 44,46,56,255 | StrokeWidth 0

[Thumb1]
Meter=Image
MeasureName=mF1
X=16
Y=92
W=128
H=72
PreserveAspectRatio=2
Hidden=1
DynamicVariables=1
ToolTipText=[mN1]
LeftMouseUpAction=[!WriteKeyValue Variables Current "[mF1]" "#@#State.inc"][!Delay 250][!Refresh *]

