[Rainmeter]
Update=1000
AccurateText=1

[Variables]
Pad=16
ThumbW=128
ThumbH=72

; ---------- styles ----------
[StyleText]
FontFace=Segoe UI
FontColor=235,235,240,255
AntiAlias=1

[StyleBtn]
FontFace=Segoe UI
FontColor=235,235,240,255
AntiAlias=1
FontSize=10
SolidColor=62,66,80,255
Padding=12,6,12,6
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "88,100,140,255"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "62,66,80,255"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; ---------- folder list (newest first, 6 per page) ----------
[mDir]
Measure=Plugin
Plugin=FileView
Path=#@#Backgrounds
Count=6
ShowDotDot=0
ShowFolder=0
Extensions="jpg;jpeg;png;bmp;gif"
SortType=Date
SortDateType=Created
SortAscending=0
FinishAction=[!UpdateMeasureGroup Children][!UpdateMeter *][!Redraw]

[mF1]
Measure=Plugin
Plugin=FileView
Path=[mDir]
Type=FilePath
Index=1
Group=Children
IfMatch=.+
IfMatchAction=[!ShowMeter Thumb1]
IfNotMatchAction=[!HideMeter Thumb1]
IfMatchMode=1

[mN1]
Measure=Plugin
Plugin=FileView
Path=[mDir]
Type=FileName
Index=1
Group=Children

[mF2]
Measure=Plugin
Plugin=FileView
Path=[mDir]
Type=FilePath
