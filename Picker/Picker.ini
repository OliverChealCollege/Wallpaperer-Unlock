MeterStyle=StyleBtn
X=#Pad#
Y=252
Text=< Newer
LeftMouseUpAction=[!CommandMeasure mDir "PageUp"][!UpdateMeasure mDir][!UpdateMeasureGroup Children][!UpdateMeter *][!Redraw]

